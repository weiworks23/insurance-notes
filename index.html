<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保險險種特別事項與核保理賠知識庫</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --bg-page: #f8fafc;
      --border-color: #cbd5e1;
      --border-light: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      
      --btn-orange: #ea580c;
      --btn-green: #059669;
      --btn-red: #dc2626;
      --btn-blue: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      padding: 18px 24px;
      font-size: 14px;
    }

    /* 頂部列 */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e3a8a;
    }

    .autosave-badge {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .autosave-badge.saving {
      background: #fefce8;
      color: #854d0e;
      border-color: #fef08a;
    }

    .btn-group-top {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-orange { background-color: var(--btn-orange); }
    .btn-green { background-color: var(--btn-green); }
    .btn-red { background-color: var(--btn-red); }
    .btn-blue { background-color: var(--btn-blue); }

    /* 搜尋列 */
    .search-container {
      margin-bottom: 16px;
      max-width: 480px;
    }
    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-input-wrap input {
      width: 100%;
      padding: 8px 12px 8px 32px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #fff;
      font-size: 0.88rem;
      outline: none;
    }
    .search-input-wrap input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.15);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* 主雙欄版型 */
    .main-workspace {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      align-items: start;
    }

    /* 左側清單 */
    .sidebar-panel {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .sidebar-header {
      padding: 10px 14px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      color: #374151;
      font-size: 0.88rem;
    }
    .sidebar-header .sub-tip {
      font-weight: normal;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .item-list {
      max-height: calc(100vh - 170px);
      overflow-y: auto;
      list-style: none;
    }
    .item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-light);
      cursor: grab;
      user-select: none;
      transition: background 0.1s;
      background: #fff;
    }
    .item-row:active { cursor: grabbing; }
    .item-row:hover { background: #f8fafc; }
    .item-row.active {
      background: #e0f2fe;
      border-left: 4px solid #0284c7;
    }
    .item-row.dragging {
      opacity: 0.45;
      background: #f1f5f9;
      border: 1px dashed #64748b;
    }
    .item-row.drag-over-top { border-top: 2.5px solid var(--primary); }
    .item-row.drag-over-bottom { border-bottom: 2.5px solid var(--primary); }

    .drag-handle-icon {
      color: #94a3b8;
      font-size: 0.9rem;
      flex-shrink: 0;
      opacity: 0.6;
    }
    .item-row:hover .drag-handle-icon { opacity: 1; color: #64748b; }

    .item-name {
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    /* 右側主表單編輯區 */
    .editor-panel {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .form-name-row {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-weight: 700;
      color: #374151;
      margin-bottom: 6px;
      font-size: 0.88rem;
    }
    .form-group input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.92rem;
      outline: none;
      background: #fff;
    }
    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.1);
    }

    /* 公司 DM (PDF) 專屬區塊 */
    .dm-upload-panel {
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 20px;
    }
    .dm-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .dm-panel-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dm-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }
    .dm-item-chip {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .dm-item-chip .pdf-icon { color: #dc2626; font-weight: bold; }
    .dm-item-chip .file-name {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
      color: #1e293b;
    }
    .dm-item-chip .file-size { font-size: 0.75rem; color: #94a3b8; }
    .dm-actions { display: flex; gap: 4px; }
    .btn-chip-action {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px 5px;
      border-radius: 4px;
      color: var(--primary);
    }
    .btn-chip-action:hover { background: #eff6ff; }
    .btn-chip-action.delete { color: #dc2626; }
    .btn-chip-action.delete:hover { background: #fee2e2; }

    /* 各知識區塊 */
    .section-box {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 16px;
      overflow: hidden;
      background: #fff;
      transition: border-color 0.15s;
    }
    .section-box:hover { border-color: #94a3b8; }
    .section-header-bar {
      padding: 8px 12px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    
    .title-input-badge {
      border: 1.5px solid #2563eb;
      background: #fff;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #1e3a8a;
      outline: none;
      flex: 1;
      max-width: 520px;
    }
    .title-input-badge:focus {
      background: #eff6ff;
      border-color: #1d4ed8;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    .delete-sec-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .delete-sec-btn:hover { color: var(--btn-red); background: #fee2e2; }

    .section-textarea {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      border: none;
      outline: none;
      font-size: 0.92rem;
      line-height: 1.6;
      resize: vertical;
      font-family: inherit;
      color: #1e293b;
    }
    .section-textarea:focus { background: #fafafa; }

    .add-sec-bar {
      display: flex;
      justify-content: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border-light);
    }

    #import-file-input, #dm-file-input { display: none; }
  </style>
</head>
<body>

  <!-- 頂部功能列 -->
  <div class="top-header">
    <div class="header-title-wrap">
      <div class="header-title">
        <span>📖</span> 保險險種特別事項與核保理賠知識庫
      </div>
      <span class="autosave-badge" id="autosave-indicator">✓ 已自動儲存</span>
    </div>
    <div class="btn-group-top">
      <button class="btn btn-orange" onclick="exportData()">下載知識庫備份</button>
      <button class="btn btn-orange" onclick="document.getElementById('import-file-input').click()">匯入備份</button>
      <button class="btn btn-green" onclick="addNewInsurance()">+ 新增險種項目</button>
      <button class="btn btn-red" onclick="deleteCurrentInsurance()">刪除當前險種</button>
      <input type="file" id="import-file-input" accept=".json" onchange="importData(event)">
    </div>
  </div>

  <!-- 搜尋列 -->
  <div class="search-container">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-box" placeholder="搜尋險種名稱、理賠規則、條款重點..." oninput="handleSearch()">
    </div>
  </div>

  <!-- 主操作視圖 -->
  <div class="main-workspace">
    <!-- 左側險種清單 -->
    <div class="sidebar-panel">
      <div class="sidebar-header">
        <span id="list-count-label">險種清單 (0)</span>
        <span class="sub-tip">可拖曳上下排序</span>
      </div>
      <ul class="item-list" id="insurance-list"></ul>
    </div>

    <!-- 右側表單工作區 -->
    <div class="editor-panel">
      <!-- 險種名稱 -->
      <div class="form-name-row">
        <div class="form-group">
          <label>險種 / 商品名稱：</label>
          <input type="text" id="input-name" placeholder="" oninput="updateCurrentItemName(this.value)">
        </div>
      </div>

      <!-- 公司官方 DM (PDF 附件) 區塊 -->
      <div class="dm-upload-panel">
        <div class="dm-panel-header">
          <div class="dm-panel-title">
            <span>📑</span> 公司商品 DM / 條款費率表 (PDF)
          </div>
          <button class="btn btn-blue" style="padding: 4px 10px; font-size: 0.8rem;" onclick="document.getElementById('dm-file-input').click()">
            + 附加公司 DM (PDF)
          </button>
          <input type="file" id="dm-file-input" accept="application/pdf" multiple onchange="handleDMAttach(event)">
        </div>
        <div class="dm-list" id="dm-file-list">
          <!-- 動態載入 PDF 檔案標籤 -->
        </div>
      </div>

      <!-- 動態自訂知識區塊容器 -->
      <div id="dynamic-sections-container"></div>

      <!-- 新增自訂區塊按鈕 -->
      <div class="add-sec-bar">
        <button class="btn btn-blue" onclick="addNewSectionToCurrent()">＋ 新增自訂知識區塊</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_TEMPLATE = [
      {
        id: "item_init_1",
        name: "實支實付",
        sections: [
          { title: "⚠️ 理賠注意事項 / 常見拒賠爭議 / 等候期", content: "" },
          { title: "📋 核保規則 / 體況承保限制 / 告知重點", content: "" },
          { title: "📑 條款給付特色 / 給付公式 / 續保年限", content: "" },
          { title: "💡 客戶溝通切入點 / 競品比較優勢", content: "" }
        ]
      }
    ];

    const STORAGE_KEY = "offline_insurance_custom_sections_db";
    let knowledgeList = [];
    let activeId = "";
    let autoSaveTimer = null;
    let draggedItemId = null;

    /* IndexedDB 儲存大容量 PDF 檔案，避免擠爆 LocalStorage */
    const DB_NAME = "InsuranceNotesFilesDB";
    const DB_VERSION = 1;
    const STORE_NAME = "pdf_files";
    let dbInstance = null;

    function initIndexedDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: "id" });
          }
        };
        req.onsuccess = (e) => {
          dbInstance = e.target.result;
          resolve(dbInstance);
        };
        req.onerror = (e) => reject(e.target.error);
      });
    }

    function savePDFToDB(fileRecord) {
      return new Promise((resolve, reject) => {
        const tx = dbInstance.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        store.put(fileRecord);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function getPDFFromDB(fileId) {
      return new Promise((resolve, reject) => {
        const tx = dbInstance.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const req = store.get(fileId);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function deletePDFFromDB(fileId) {
      return new Promise((resolve, reject) => {
        const tx = dbInstance.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        store.delete(fileId);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // 啟動入口
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        await initIndexedDB();
      } catch (err) {
        console.error("IndexedDB 初始化失敗", err);
      }

      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          knowledgeList = JSON.parse(saved);
        } catch (e) {
          knowledgeList = JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
        }
      } else {
        knowledgeList = JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
        persistData();
      }

      if (knowledgeList.length > 0) {
        activeId = knowledgeList[0].id;
      }

      renderList();
      loadActiveToEditor();
    });

    // 自動儲存（防抖）
    function triggerAutoSave() {
      const indicator = document.getElementById("autosave-indicator");
      indicator.className = "autosave-badge saving";
      indicator.textContent = "⏳ 儲存中...";

      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        persistData();
        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
        indicator.className = "autosave-badge";
        indicator.textContent = `✓ 已自動儲存 (${timeStr})`;
      }, 300);
    }

    function persistData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(knowledgeList));
    }

    // 渲染左側險種清單（拖曳排序）
    function renderList() {
      const ul = document.getElementById("insurance-list");
      const keyword = document.getElementById("search-box").value.trim().toLowerCase();
      ul.innerHTML = "";

      const filtered = knowledgeList.filter(item => {
        if (!keyword) return true;
        const secText = (item.sections || []).map(s => `${s.title} ${s.content}`).join(" ");
        const searchPool = `${item.name} ${secText}`.toLowerCase();
        return searchPool.includes(keyword);
      });

      document.getElementById("list-count-label").textContent = `險種清單 (${filtered.length})`;

      filtered.forEach(item => {
        const li = document.createElement("li");
        li.className = `item-row ${item.id === activeId ? "active" : ""}`;
        li.dataset.id = item.id;
        
        const isSearchActive = keyword !== "";
        li.draggable = !isSearchActive;

        li.innerHTML = `
          <span class="drag-handle-icon" title="${isSearchActive ? '搜尋中暫時停用拖曳' : '按住拖曳排序'}">⋮⋮</span>
          <div class="item-name">${escapeHTML(item.name || "未命名險種")}</div>
        `;

        li.onclick = () => selectItem(item.id);

        if (!isSearchActive) {
          li.addEventListener("dragstart", (e) => {
            draggedItemId = item.id;
            li.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", item.id);
          });

          li.addEventListener("dragend", () => {
            li.classList.remove("dragging");
            clearDropClasses();
            draggedItemId = null;
          });

          li.addEventListener("dragover", (e) => {
            e.preventDefault();
            if (draggedItemId === item.id) return;
            const rect = li.getBoundingClientRect();
            const midpoint = rect.top + rect.height / 2;
            clearDropClasses();
            if (e.clientY < midpoint) {
              li.classList.add("drag-over-top");
            } else {
              li.classList.add("drag-over-bottom");
            }
          });

          li.addEventListener("dragleave", () => {
            li.classList.remove("drag-over-top", "drag-over-bottom");
          });

          li.addEventListener("drop", (e) => {
            e.preventDefault();
            if (!draggedItemId || draggedItemId === item.id) return;

            const fromIndex = knowledgeList.findIndex(x => x.id === draggedItemId);
            let toIndex = knowledgeList.findIndex(x => x.id === item.id);
            const rect = li.getBoundingClientRect();
            const isBottom = e.clientY >= (rect.top + rect.height / 2);

            clearDropClasses();

            if (fromIndex !== -1 && toIndex !== -1) {
              const [moved] = knowledgeList.splice(fromIndex, 1);
              if (isBottom && fromIndex > toIndex) {
                toIndex += 1;
              } else if (!isBottom && fromIndex < toIndex) {
                toIndex -= 1;
              }
              knowledgeList.splice(toIndex, 0, moved);
              
              triggerAutoSave();
              renderList();
            }
          });
        }

        ul.appendChild(li);
      });
    }

    function clearDropClasses() {
      document.querySelectorAll(".item-row").forEach(el => {
        el.classList.remove("drag-over-top", "drag-over-bottom");
      });
    }

    function selectItem(id) {
      activeId = id;
      renderList();
      loadActiveToEditor();
    }

    // 載入當前險種至編輯器
    function loadActiveToEditor() {
      const container = document.getElementById("dynamic-sections-container");
      container.innerHTML = "";

      const curr = knowledgeList.find(x => x.id === activeId);
      if (!curr) {
        document.getElementById("input-name").value = "";
        renderDMFileList([]);
        return;
      }

      document.getElementById("input-name").value = curr.name || "";

      // 渲染 PDF DM 清單
      renderDMFileList(curr.dmFiles || []);

      if (!curr.sections) curr.sections = [];

      curr.sections.forEach((sec, idx) => {
        const secDiv = document.createElement("div");
        secDiv.className = "section-box";

        secDiv.innerHTML = `
          <div class="section-header-bar">
            <input type="text" class="title-input-badge" value="${escapeHTML(sec.title)}" 
              placeholder=""
              oninput="updateSectionTitle(${idx}, this.value)">
            <button class="delete-sec-btn" onclick="deleteSection(${idx})">🗑️ 刪除區塊</button>
          </div>
          <textarea class="section-textarea" 
            placeholder="" 
            oninput="updateSectionContent(${idx}, this.value)">${escapeHTML(sec.content || "")}</textarea>
        `;
        container.appendChild(secDiv);
      });
    }

    /* 公司 DM (PDF) 處理邏輯 */
    function renderDMFileList(files) {
      const listContainer = document.getElementById("dm-file-list");
      listContainer.innerHTML = "";

      if (!files || files.length === 0) {
        listContainer.innerHTML = `<span style="color:#94a3b8; font-size:0.85rem;">尚未附加任何 DM，可點擊右上角按鈕選取 PDF 檔案。</span>`;
        return;
      }

      files.forEach((file, idx) => {
        const chip = document.createElement("div");
        chip.className = "dm-item-chip";
        chip.innerHTML = `
          <span class="pdf-icon">PDF</span>
          <span class="file-name" title="${escapeHTML(file.name)}">${escapeHTML(file.name)}</span>
          <span class="file-size">${formatFileSize(file.size)}</span>
          <div class="dm-actions">
            <button class="btn-chip-action" onclick="viewPDF('${file.id}')">👁️ 預覽</button>
            <button class="btn-chip-action delete" onclick="removeDMAttach(${idx}, '${file.id}')">🗑️</button>
          </div>
        `;
        listContainer.appendChild(chip);
      });
    }

    async function handleDMAttach(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      const curr = knowledgeList.find(x => x.id === activeId);
      if (!curr) return;
      if (!curr.dmFiles) curr.dmFiles = [];

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
          alert(`檔案「${file.name}」不是 PDF 格式！`);
          continue;
        }

        const fileId = "pdf_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);
        
        // 存入 IndexedDB
        await savePDFToDB({
          id: fileId,
          name: file.name,
          blob: file
        });

        // 僅將 metadata 存入 LocalStorage
        curr.dmFiles.push({
          id: fileId,
          name: file.name,
          size: file.size,
          uploadAt: new Date().toISOString()
        });
      }

      triggerAutoSave();
      renderDMFileList(curr.dmFiles);
      event.target.value = "";
    }

    async function viewPDF(fileId) {
      try {
        const record = await getPDFFromDB(fileId);
        if (record && record.blob) {
          const fileURL = URL.createObjectURL(record.blob);
          window.open(fileURL, "_blank");
        } else {
          alert("找不到該 PDF 內容，請確認檔案是否已移除。");
        }
      } catch (err) {
        alert("開啟 PDF 失敗：" + err.message);
      }
    }

    async function removeDMAttach(idx, fileId) {
      const curr = knowledgeList.find(x => x.id === activeId);
      if (!curr || !curr.dmFiles) return;

      if (confirm(`確定要移除「${curr.dmFiles[idx].name}」嗎？`)) {
        curr.dmFiles.splice(idx, 1);
        try {
          await deletePDFFromDB(fileId);
        } catch (e) {
          console.warn("從 IndexedDB 清除失敗", e);
        }
        triggerAutoSave();
        renderDMFileList(curr.dmFiles);
      }
    }

    function formatFileSize(bytes) {
      if (!bytes || bytes === 0) return "0 B";
      const k = 1024;
      const sizes = ["B", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
    }

    /* 文字欄位更新 */
    function updateCurrentItemName(val) {
      const curr = knowledgeList.find(x => x.id === activeId);
      if (!curr) return;
      curr.name = val;
      triggerAutoSave();
      renderList();
    }

    function updateSectionTitle(secIndex, newTitle) {
      const curr = knowledgeList.find(x => x.id === activeId);
      if (!curr || !curr.sections[secIndex]) return;
      curr.sections[secIndex].title = newTitle;
      triggerAutoSave();
    }

    function updateSectionContent(secIndex, newContent) {
      const curr = knowledgeList.find(x => x.id === activeId);
      if (!curr || !curr.sections[secIndex]) return;
      curr.sections[secIndex].content = newContent;
      triggerAutoSave();
    }

    function addNewSectionToCurrent() {
      const curr = knowledgeList.find(x => x.id === activeId);
      if (!curr) return;
      if (!curr.sections) curr.sections = [];

      curr.sections.push({
        title: "📌 新增自訂標題",
        content: ""
      });

      triggerAutoSave();
      loadActiveToEditor();
    }

    function deleteSection(secIndex) {
      const curr = knowledgeList.find(x => x.id === activeId);
      if (!curr || !curr.sections) return;

      if (confirm(`確定要刪除「${curr.sections[secIndex].title}」這個區塊嗎？`)) {
        curr.sections.splice(secIndex, 1);
        triggerAutoSave();
        loadActiveToEditor();
      }
    }

    function handleSearch() {
      renderList();
    }

    function addNewInsurance() {
      const name = prompt("請輸入新增險種名稱：", "新險種商品");
      if (!name) return;

      const newId = "item_" + Date.now();
      const newItem = {
        id: newId,
        name: name.trim(),
        dmFiles: [],
        sections: [
          { title: "⚠️ 理賠注意事項 / 常見拒賠爭議 / 等候期", content: "" },
          { title: "📋 核保規則 / 體況承保限制 / 告知重點", content: "" },
          { title: "📑 條款給付特色 / 給付公式 / 續保年限", content: "" },
          { title: "💡 客戶溝通切入點 / 競品比較優勢", content: "" }
        ]
      };

      knowledgeList.unshift(newItem);
      activeId = newId;
      triggerAutoSave();
      renderList();
      loadActiveToEditor();
      document.getElementById("input-name").focus();
    }

    function deleteCurrentInsurance() {
      const currIndex = knowledgeList.findIndex(x => x.id === activeId);
      if (currIndex === -1) return;

      const target = knowledgeList[currIndex];
      if (confirm(`確定要刪除「${target.name}」嗎？`)) {
        if (target.dmFiles && target.dmFiles.length > 0) {
          target.dmFiles.forEach(f => deletePDFFromDB(f.id));
        }
        knowledgeList.splice(currIndex, 1);
        if (knowledgeList.length > 0) {
          activeId = knowledgeList[0].id;
        } else {
          activeId = "";
        }
        triggerAutoSave();
        renderList();
        loadActiveToEditor();
      }
    }

    function exportData() {
      const jsonStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(knowledgeList, null, 2));
      const a = document.createElement("a");
      a.setAttribute("href", jsonStr);
      a.setAttribute("download", `保險知識庫備份_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            if (confirm("匯入備份將覆蓋現有文字筆記資料，是否繼續？")) {
              knowledgeList = imported;
              if (knowledgeList.length > 0) activeId = knowledgeList[0].id;
              persistData();
              renderList();
              loadActiveToEditor();
              alert("資料庫已成功還原！");
            }
          } else {
            alert("格式錯誤：檔案必須為 JSON 陣列。");
          }
        } catch (err) {
          alert("解析備份檔案失敗：" + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function escapeHTML(str) {
      if (!str) return "";
      return String(str).replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
